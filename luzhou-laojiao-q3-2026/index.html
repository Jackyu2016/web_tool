<script id="post-data" type="application/json">
{
  "title": "利润降57%却涨停，泸州老窖凭什么？",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月1日 00:05",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"font-size:15px;line-height:1.9;color:#8a8378;margin:0 0 18px;letter-spacing:0.5px;\">10 月 30 日，A 股震荡调整，白酒板块逆市上扬。泸州老窖午后封涨停，收 77.07 元，涨 10.01%。同一天，它交出了一份很难看的三季报。</p>\n\n<p style=\"font-size:26px;line-height:1.5;color:#1a1a1a;font-weight:900;margin:0 0 20px;letter-spacing:0.5px;\">利润降了 57%，股价却涨停。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">前三季度，营收 146.68 亿，同比 -36.6%；归母净利润 56.71 亿，同比 -47.3%。Q3 单季更难看，净利 13.32 亿，同比 -57%。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;letter-spacing:0.3px;\">这么一份报表，市场为什么用涨停回应？我把它拆开来，一层一层说。</p>\n\n<p style=\"font-size:17px;line-height:1.85;color:#8b2e2e;font-weight:bold;margin:0 0 26px;letter-spacing:0.3px;\">先给结论：最难看的数字，可能恰恰是最难的时刻。价盘稳了、现金流回来了、分红保底 85 亿——这三条，市场认。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#8b2e2e;color:#fff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">01</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#8b2e2e;margin:12px 0 22px;border-bottom:3px solid #8b2e2e;padding-bottom:9px;\">先看报表：数字到底说了什么</p>\n\n<p style=\"font-size:13px;color:#8a8378;text-align:center;margin:0 0 10px;letter-spacing:0.5px;\">泸州老窖 2026 年前三季度核心数据</p>\n\n<table style=\"width:100%;border-collapse:collapse;margin:0 0 26px;font-size:14px;\">\n  <tr>\n    <td style=\"padding:11px 12px;color:#6b6b6b;border-bottom:1px solid #ece3d2;background:#faf6ef;\">前三季度营业收入</td>\n    <td style=\"padding:11px 12px;color:#1a1a1a;font-weight:bold;text-align:right;border-bottom:1px solid #ece3d2;background:#faf6ef;\">146.68 亿</td>\n    <td style=\"padding:11px 12px;color:#c0392b;text-align:right;border-bottom:1px solid #ece3d2;background:#faf6ef;\">-36.6%</td>\n  </tr>\n  <tr>\n    <td style=\"padding:11px 12px;color:#6b6b6b;border-bottom:1px solid #ece3d2;\">前三季度归母净利润</td>\n    <td style=\"padding:11px 12px;color:#1a1a1a;font-weight:bold;text-align:right;border-bottom:1px solid #ece3d2;\">56.71 亿</td>\n    <td style=\"padding:11px 12px;color:#c0392b;text-align:right;border-bottom:1px solid #ece3d2;\">-47.3%</td>\n  </tr>\n  <tr>\n    <td style=\"padding:11px 12px;color:#6b6b6b;border-bottom:1px solid #ece3d2;background:#faf6ef;\">Q3 单季营收</td>\n    <td style=\"padding:11px 12px;color:#1a1a1a;font-weight:bold;text-align:right;border-bottom:1px solid #ece3d2;background:#faf6ef;\">41.95 亿</td>\n    <td style=\"padding:11px 12px;color:#c0392b;text-align:right;border-bottom:1px solid #ece3d2;background:#faf6ef;\">-37.1%</td>\n  </tr>\n  <tr>\n    <td style=\"padding:11px 12px;color:#6b6b6b;border-bottom:1px solid #ece3d2;\">Q3 单季归母净利润</td>\n    <td style=\"padding:11px 12px;color:#1a1a1a;font-weight:bold;text-align:right;border-bottom:1px solid #ece3d2;\">13.32 亿</td>\n    <td style=\"padding:11px 12px;color:#c0392b;text-align:right;border-bottom:1px solid #ece3d2;\">-57.0%</td>\n  </tr>\n  <tr>\n    <td style=\"padding:11px 12px;color:#8b2e2e;font-weight:bold;background:#faf6ef;\">Q3 经营现金流净额</td>\n    <td style=\"padding:11px 12px;color:#8b2e2e;font-weight:bold;text-align:right;background:#faf6ef;\">23.64 亿</td>\n    <td style=\"padding:11px 12px;color:#8b2e2e;font-weight:bold;text-align:right;background:#faf6ef;\">超上半年</td>\n  </tr>\n</table>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">利润下滑是事实，不用粉饰。但看报表不能只看利润。有一个数字，比利润重要得多——<strong style=\"color:#8b2e2e;\">Q3 单季经营现金流净额 23.64 亿，已经超过了上半年的 20.82 亿</strong>。</p>\n\n<p style=\"text-align:center;margin:6px 0 8px;\">\n  <img src=\"assets/cashflow.png\" style=\"width:100%;border-radius:10px;display:block;border:1px solid #ece3d2;\" />\n</p>\n<p style=\"font-size:12px;color:#9a9082;text-align:center;margin:0 0 26px;line-height:1.6;\">▲ 经营现金流净额环比大幅改善。数据来源：公司半年报、三季报</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">利润是权责发生制，可以调节；现金流是真金白银，骗不了人。Q3 回款比上半年好，说明渠道的钱开始往回走了，动销在边际改善。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#6b6b6b;background:#faf3e8;border-left:4px solid #b8862f;padding:16px 18px;margin:0 0 24px;letter-spacing:0.3px;line-height:1.85;\">利润还在底部，但现金流先拐头了——这往往是困境反转的第一个信号。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#8b2e2e;color:#fff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">02</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#8b2e2e;margin:12px 0 22px;border-bottom:3px solid #8b2e2e;padding-bottom:9px;\">护城河没丢：最硬的东西还在</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">行业下行期，最该看的不是增速，是护城河还在不在。泸州老窖的护城河，是钱买不走的东西。</p>\n\n<p style=\"text-align:center;font-size:0;margin:8px 0 10px;\">\n  <span style=\"display:inline-block;width:31.5%;background:#faf3e8;border:1px solid #ecdfc8;border-radius:12px;padding:18px 4px;margin:0 1%;vertical-align:top;box-sizing:border-box;\">\n    <span style=\"display:block;font-size:27px;font-weight:900;color:#8b2e2e;line-height:1.1;\">1619</span>\n    <span style=\"display:block;font-size:11px;color:#6b6b6b;margin-top:7px;line-height:1.5;\">口百年以上窖池</span>\n  </span>\n  <span style=\"display:inline-block;width:31.5%;background:#faf3e8;border:1px solid #ecdfc8;border-radius:12px;padding:18px 4px;margin:0 1%;vertical-align:top;box-sizing:border-box;\">\n    <span style=\"display:block;font-size:27px;font-weight:900;color:#8b2e2e;line-height:1.1;\">91.3%</span>\n    <span style=\"display:block;font-size:11px;color:#6b6b6b;margin-top:7px;line-height:1.5;\">百年以上国宝窖池<br/>占全行业比例</span>\n  </span>\n  <span style=\"display:inline-block;width:31.5%;background:#faf3e8;border:1px solid #ecdfc8;border-radius:12px;padding:18px 4px;margin:0 1%;vertical-align:top;box-sizing:border-box;\">\n    <span style=\"display:block;font-size:27px;font-weight:900;color:#8b2e2e;line-height:1.1;\">450+</span>\n    <span style=\"display:block;font-size:11px;color:#6b6b6b;margin-top:7px;line-height:1.5;\">年连续酿造<br/>从未间断</span>\n  </span>\n</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">浓香型白酒的核心资产是窖池。窖池越老，窖泥里的微生物群落越稳定、越丰富，出的酒越醇。一套成熟的窖池生态，要几十上百年才能养出来。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;letter-spacing:0.3px;\">新窖池出的酒，和老窖池不是一个东西。这不是配方问题，是时间问题。全国百年以上的国宝窖池，九成以上在泸州老窖手里。</p>\n\n<p style=\"font-size:17px;line-height:1.85;color:#8b2e2e;font-weight:bold;margin:0 0 22px;letter-spacing:0.3px;\">钱可以砸广告、盖厂房，但买不走四百五十年的时间。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">这次调整里，最关键的正面信号是<strong>价盘稳住了</strong>。据渠道调研，高度国窖 1573 批价至今保持相对平稳；公司在股东大会上明确表态，52 度国窖 1573 终端价格已成功企稳。低度国窖延续全国化，已经站稳百亿级低度白酒阵营。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">价格没崩，品牌就没伤。品牌在，护城河就在。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#8b2e2e;color:#fff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">03</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#8b2e2e;margin:12px 0 22px;border-bottom:3px solid #8b2e2e;padding-bottom:9px;\">管理层在做什么</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">这份报表不是被动挨打打出来的，是主动选择的结果。公司在做几件事：</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 14px;letter-spacing:0.3px;\"><strong style=\"color:#8b2e2e;\">一、控量挺价，以销定产。</strong>不追求短期数字好看，主动控产降速，优先消化渠道库存。董事长刘淼多次强调，以终端真实动销、渠道库存、价盘水平为锚，动态调整生产发货。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 14px;letter-spacing:0.3px;\"><strong style=\"color:#8b2e2e;\">二、配额精细化管理。</strong>推行\"以销定配、配额挂钩动销\"，把渠道配额和真实开瓶量绑定。库存总量持续回落，挤掉的是水分，留下的是真实需求。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 14px;letter-spacing:0.3px;\"><strong style=\"color:#8b2e2e;\">三、营销数字化 3.0。</strong>总经理林锋把 2026 年定为公司\"数字化应用年\"，营销工作全面迈入数字化 3.0 阶段。用数据管渠道、管终端、管动销，而不是靠拍脑袋。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 14px;letter-spacing:0.3px;\"><strong style=\"color:#8b2e2e;\">四、区域深耕。</strong>\"235+100\"区域战略深化，百城计划 3.0 启动。在行业收缩期反而扎深渠道，等行业回暖时，这些点位就是放大器。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 14px;letter-spacing:0.3px;\"><strong style=\"color:#8b2e2e;\">五、低度化卡位下一代。</strong>低度国窖站稳百亿级，提前布局年轻消费场景。别人在守，它在卡位。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;letter-spacing:0.3px;\"><strong style=\"color:#8b2e2e;\">六、品质定力不动摇。</strong>持续推进优质产能储备与质量提升计划，加大优质基酒的战略储备。行业下行期不偷工减料，这是最贵的品牌资产。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">这一套动作看下来，管理层没有慌。它在做对的事，只是对的事短期会让报表难看。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#6b6b6b;background:#faf3e8;border-left:4px solid #b8862f;padding:16px 18px;margin:0 0 24px;letter-spacing:0.3px;line-height:1.85;\">下行期最考验管理层：是保报表还是保长期。泸州老窖选了后者。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#8b2e2e;color:#fff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">04</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#8b2e2e;margin:12px 0 22px;border-bottom:3px solid #8b2e2e;padding-bottom:9px;\">现在贵不贵：PB 2.4 倍，分红保底 85 亿</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">看估值，先看三个数：每股净资产、股价、分红承诺。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">截至三季报，泸州老窖每股净资产 31.97 元。涨停后股价 77.07 元，对应 PB 约 2.41 倍；涨停前股价约 70 元，PB 只有约 2.19 倍。</p>\n\n<p style=\"text-align:center;margin:6px 0 8px;\">\n  <img src=\"assets/valuation_compare.png\" style=\"width:100%;border-radius:10px;display:block;border:1px solid #ece3d2;\" />\n</p>\n<p style=\"font-size:12px;color:#9a9082;text-align:center;margin:0 0 26px;line-height:1.6;\">▲ 三大白酒估值对比。泸州老窖 PB 最低、股息率最高。数据来源：各公司年报、公开行情</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">横向比一眼：贵州茅台 PB 6.42 倍，五粮液约 4.3 倍，泸州老窖 2.4 倍。它是三大白酒里最便宜的那个。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">再看市值。泸州老窖总股本约 14.7 亿股，涨停后市值约 1130 亿；贵州茅台 1.74 万亿，五粮液约 5000 亿。泸州老窖的市值，只有茅台的十五分之一、五粮液的五分之一。</p>\n\n<p style=\"font-size:17px;line-height:1.85;color:#8b2e2e;font-weight:bold;margin:0 0 22px;letter-spacing:0.3px;\">股本小、市值小，意味着一旦困境反转，向上的弹性远大于茅台五粮液。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">最硬核的保底，来自分红承诺。根据公司《2024-2026 年度股东分红回报规划》，<strong style=\"color:#8b2e2e;\">2026 年度现金分红总额不低于归母净利润的 75%，且不低于 85 亿元</strong>。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">注意，是\"且\"——两条都要满足。哪怕 2026 年全年利润只有 75 亿，75% 只有 56 亿，但\"不低于 85 亿\"这条硬保底，意味着公司会用以前年度的留存利润补足差额。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 14px;letter-spacing:0.3px;\">按涨停前 70 元股价、市值约 1030 亿算：</p>\n\n<p style=\"font-size:16px;line-height:1.95;color:#2b2b2b;margin:0 0 8px;letter-spacing:0.3px;\"><strong style=\"color:#b8862f;\">股息率</strong> = 85 亿 ÷ 1030 亿 ≈ <strong style=\"color:#8b2e2e;\">8.25%</strong></p>\n<p style=\"font-size:16px;line-height:1.95;color:#2b2b2b;margin:0 0 8px;letter-spacing:0.3px;\"><strong style=\"color:#b8862f;\">利润收益率</strong> = 全年利润（保守估 75 亿）÷ 1030 亿 ≈ <strong style=\"color:#8b2e2e;\">7.3%</strong></p>\n<p style=\"font-size:16px;line-height:1.95;color:#2b2b2b;margin:0 0 22px;letter-spacing:0.3px;\"><strong style=\"color:#b8862f;\">PB 对应的 ROE</strong> ≈ （75 亿 ÷ 净资产 470 亿）÷ PB 2.19 ≈ <strong style=\"color:#8b2e2e;\">7.3% 盈利回报</strong></p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">8.25% 的股息率，已经超过绝大多数固收产品。这是保底的、现金形式的回报。再加上利润本身对应的盈利能力，以及未来利润修复带来的增长——</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#6b6b6b;background:#faf3e8;border-left:4px solid #b8862f;padding:16px 18px;margin:0 0 24px;letter-spacing:0.3px;line-height:1.85;\">这个位置买进去，光分红就有保底，下行空间被分红托住，上行空间靠利润修复打开。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#8b2e2e;color:#fff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">05</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#8b2e2e;margin:12px 0 22px;border-bottom:3px solid #8b2e2e;padding-bottom:9px;\">弹性在哪：困境反转 + 海外惊喜</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">保底是分红，弹性是反转。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">2024 年泸州老窖归母净利润 134.73 亿，2025 年 108.31 亿，2026 年大概率落到 75 亿上下。利润砍了快一半。这里面有多少是周期、有多少是主动控量，市场心里清楚。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">一旦行业库存出清、价盘企稳传导到报表，利润从 75 亿回到 100 亿、再回到 130 亿，每一步都是实打实的弹性。而现在的市值，只给了 75 亿利润的定价。</p>\n\n<p style=\"font-size:17px;line-height:1.85;color:#8b2e2e;font-weight:bold;margin:0 0 22px;letter-spacing:0.3px;\">最坏的时候已经在报表里了，最好的时候还没被定价。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">海外是另一个隐藏惊喜。泸州老窖的经销网络已经覆盖全球 70 多个国家和地区；截至 2026 年 6 月底，境外经销商 106 家，同比增长 20.45%；进入全球 15 个国家的 71 个国际机场免税终端，覆盖零售终端超过 2000 个。2023 年还首次通过泸州中欧班列把白酒出口到俄罗斯。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">海外收入目前占比还不高，但增速快、基数低。它绑定顶级赛事 IP、铺免税渠道，做的是长期的事。白酒国际化一旦跑通，那是另一条增长曲线。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#8b2e2e;color:#fff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">06</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#8b2e2e;margin:12px 0 22px;border-bottom:3px solid #8b2e2e;padding-bottom:9px;\">前提与风险，也明说</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">上面的判断要成立，得满足几个前提：</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#2b2b2b;margin:0 0 10px;letter-spacing:0.3px;\">① 国窖 1573 的价盘能够持续企稳，不出现二次松动；</p>\n<p style=\"font-size:15px;line-height:1.9;color:#2b2b2b;margin:0 0 10px;letter-spacing:0.3px;\">② 渠道库存如期回归健康水平，动销真实回暖；</p>\n<p style=\"font-size:15px;line-height:1.9;color:#2b2b2b;margin:0 0 10px;letter-spacing:0.3px;\">③ 2026 年 85 亿分红承诺按期兑现；</p>\n<p style=\"font-size:15px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">④ 行业不出现更长期、更严厉的限制性政策。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 16px;letter-spacing:0.3px;\">风险也要直说：如果行业调整深度和时长超预期，利润可能继续下探；85 亿分红若大幅超过当年利润，需要消耗历史留存，不是无限可持续；短期股价波动无法预测，涨停不代表拐点已确认。</p>\n\n<p style=\"font-size:17px;line-height:1.85;color:#8b2e2e;font-weight:bold;margin:0 0 22px;letter-spacing:0.3px;\">我算的是价值，不是股价。价值有底，股价没有。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#8b2e2e;color:#fff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">07</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#8b2e2e;margin:12px 0 22px;border-bottom:3px solid #8b2e2e;padding-bottom:9px;\">写在最后</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">10 月 30 日那个涨停，不是因为报表好看，是因为市场终于在难看的数字下面，看见了几件正在变好的事：</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 14px;letter-spacing:0.3px;\">价盘稳了。现金流回来了。分红保底 85 亿。PB 只有 2.4 倍。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">而最难的报表，可能就是最难的时刻。</p>\n\n<p style=\"font-size:21px;line-height:1.7;color:#8b2e2e;font-weight:900;text-align:center;margin:8px 0 26px;letter-spacing:0.5px;\">涨停不是终点，<br/>是市场终于看见了报表背后的东西。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">好东西一定有价值。价值在底部的时候，价格往往最难看。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 30px;letter-spacing:0.3px;\">你的钱，你负责。我的判断，我负责。</p>\n\n<p style=\"font-size:12px;line-height:1.8;color:#9a9082;margin:0 0 10px;letter-spacing:0.2px;\">声明：本文为个人投资思考记录，不构成任何投资建议。文中数据来自泸州老窖 2026 年三季度报告、半年报及公开报道，可能存在滞后或误差。股市有风险，投资需谨慎。</p>\n"

      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
