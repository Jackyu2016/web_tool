<script id="post-data" type="application/json">
{
  "title": "从120元买到68元，我为什么还在加仓泸州老窖",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月26日 19:33",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"font-size:15px;line-height:1.9;color:#8a8378;margin:0 0 18px;letter-spacing:0.5px;\">写在前面：这篇文章不荐股，也不保证明天涨。我只是把一个普通投资者，在泸州老窖上的算账过程，原原本本摊开。</p>\n\n<p style=\"font-size:26px;line-height:1.5;color:#1a1a1a;font-weight:900;margin:0 0 20px;letter-spacing:0.5px;\">69.99 元。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">这是我写这篇的时候，泸州老窖的股价。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">两年前，我从 120 元一线开始买；一路跌到 68 元，我还在买。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;letter-spacing:0.3px;\">后台被问得最多的一句话是：白酒都塌了，你还敢加？</p>\n\n<p style=\"font-size:17px;line-height:1.85;color:#8b2e2e;font-weight:bold;margin:0 0 26px;letter-spacing:0.3px;\">我不是胆子大。我只是把账，一笔一笔算过。</p>\n\n<p style=\"text-align:center;margin:6px 0 8px;\">\n  <img src=\"assets/profit_chart.png\" style=\"width:100%;border-radius:10px;display:block;border:1px solid #ece3d2;\" />\n</p>\n<p style=\"font-size:12px;color:#9a9082;text-align:center;margin:0 0 30px;line-height:1.6;\">▲ 泸州老窖归母净利润（亿元）。十年翻倍，2025 年掉头。数据来源：公司历年年报</p>\n\n<p style=\"text-align:center;font-size:18px;font-weight:bold;color:#1a1a1a;margin:52px 0 24px;line-height:1.5;\"><span style=\"display:inline-block;width:5px;height:18px;background:#8b2e2e;vertical-align:-2px;margin-right:11px;\"></span><span style=\"color:#b8862f;font-size:14px;font-weight:bold;letter-spacing:1px;\">01&nbsp;&nbsp;</span>结论先说<span style=\"display:inline-block;width:5px;height:18px;background:#8b2e2e;vertical-align:-2px;margin-left:11px;\"></span></p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;letter-spacing:0.3px;\">我不推荐任何人买股票，也不保证它明天就涨。我只说我现在怎么想、怎么算、为什么越跌越买。三句话：</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 16px;letter-spacing:0.3px;\"><strong style=\"color:#8b2e2e;\">一、护城河是时间。</strong>泸州老窖最值钱的资产，是别人花多少钱都买不走的四百多年窖池。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 16px;letter-spacing:0.3px;\"><strong style=\"color:#8b2e2e;\">二、需求没有死。</strong>三公消费和“年轻人不喝”，是两把看着吓人、其实插在周期上的刀。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;letter-spacing:0.3px;\"><strong style=\"color:#8b2e2e;\">三、价格给够了安全垫。</strong>2.4 倍 PB、6% 以上的股息，这个位置，我算得出下限。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">我从 120 买到 68，不是补仓摊低成本，是每跌一次，账越算越明白。</p>\n\n<p style=\"text-align:center;font-size:18px;font-weight:bold;color:#1a1a1a;margin:52px 0 24px;line-height:1.5;\"><span style=\"display:inline-block;width:5px;height:18px;background:#8b2e2e;vertical-align:-2px;margin-right:11px;\"></span><span style=\"color:#b8862f;font-size:14px;font-weight:bold;letter-spacing:1px;\">02&nbsp;&nbsp;</span>护城河是时间<span style=\"display:inline-block;width:5px;height:18px;background:#8b2e2e;vertical-align:-2px;margin-left:11px;\"></span></p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">很多人聊白酒的护城河，爱讲品牌、讲渠道、讲广告。但浓香型白酒真正的底牌，是窖池。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">“1573 国宝窖池群”，从公元 1573 年连续酿造到今天，四百五十多年，一天没停过。</p>\n\n<p style=\"text-align:center;font-size:0;margin:8px 0 10px;\">\n  <span style=\"display:inline-block;width:31.5%;background:#faf3e8;border:1px solid #ecdfc8;border-radius:12px;padding:18px 4px;margin:0 1%;vertical-align:top;box-sizing:border-box;\">\n    <span style=\"display:block;font-size:27px;font-weight:900;color:#8b2e2e;line-height:1.1;\">1619</span>\n    <span style=\"display:block;font-size:11px;color:#6b6b6b;margin-top:7px;line-height:1.5;\">口百年以上窖池</span>\n  </span>\n  <span style=\"display:inline-block;width:31.5%;background:#faf3e8;border:1px solid #ecdfc8;border-radius:12px;padding:18px 4px;margin:0 1%;vertical-align:top;box-sizing:border-box;\">\n    <span style=\"display:block;font-size:27px;font-weight:900;color:#8b2e2e;line-height:1.1;\">91.3%</span>\n    <span style=\"display:block;font-size:11px;color:#6b6b6b;margin-top:7px;line-height:1.5;\">百年以上国宝窖池<br/>占全行业的比例</span>\n  </span>\n  <span style=\"display:inline-block;width:31.5%;background:#faf3e8;border:1px solid #ecdfc8;border-radius:12px;padding:18px 4px;margin:0 1%;vertical-align:top;box-sizing:border-box;\">\n    <span style=\"display:block;font-size:27px;font-weight:900;color:#8b2e2e;line-height:1.1;\">450+</span>\n    <span style=\"display:block;font-size:11px;color:#6b6b6b;margin-top:7px;line-height:1.5;\">年，连续酿造<br/>从未间断</span>\n  </span>\n</p>\n<p style=\"font-size:12px;color:#9a9082;text-align:center;margin:0 0 26px;line-height:1.6;\">数据来源：泸州老窖官网、公司公开资料</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">这些数字的分量在哪？浓香酒的酿造里，窖池越老，窖泥里的微生物群落越稳定、越丰富，出的酒越醇。而一套成熟的窖池生态，要靠几十上百年的持续投粮和养护，才养得出来。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;letter-spacing:0.3px;\">换个说法：新窖池出的酒，和老窖池不是一个东西。这不是配方问题，是时间问题。</p>\n\n<p style=\"font-size:17px;line-height:1.85;color:#8b2e2e;font-weight:bold;margin:0 0 22px;letter-spacing:0.3px;\">钱可以盖一座一模一样的厂房，砸出一模一样的广告，但买不走四百五十年的时间。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">全国百年以上的国宝窖池，九成以上在泸州老窖手里。这个壁垒，已经不只是护城河，是护城墙。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">竞争里最贵的一种壁垒，是时间。别人不是不想抄，是抄不了。</p>\n\n<p style=\"text-align:center;font-size:18px;font-weight:bold;color:#1a1a1a;margin:52px 0 24px;line-height:1.5;\"><span style=\"display:inline-block;width:5px;height:18px;background:#8b2e2e;vertical-align:-2px;margin-right:11px;\"></span><span style=\"color:#b8862f;font-size:14px;font-weight:bold;letter-spacing:1px;\">03&nbsp;&nbsp;</span>被误读的“不喝了”<span style=\"display:inline-block;width:5px;height:18px;background:#8b2e2e;vertical-align:-2px;margin-left:11px;\"></span></p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">两个问题绕不开。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\"><strong>第一，三公消费。</strong>2012 年前后那轮限制，行业确实难受过。结果呢？白酒没有消失，它完成了从政务到商务、再到大众消费的切换。需求的结构变了，需求本身没消失。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\"><strong>第二，年轻人。</strong>这话我每年都听——“这代人不喝白酒了”。我的看法可能不讨喜：很多年轻人不是不爱喝，是还没到那个年纪、那个收入、那个场合。</p>\n\n<p style=\"font-size:19px;line-height:1.7;color:#8b2e2e;font-weight:bold;text-align:center;margin:6px 0 24px;letter-spacing:0.5px;\">25 岁喝精酿和奶茶，<br/>35 岁陪客户喝国窖 1573。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">口味是被生活改造的。白酒也不只是普通饮料，它同时是酒精、是人情、是面子、是酒桌上的社交货币。三重属性叠在一起，它的需求韧性，远超一般消费品。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">当然，我不装看不见数据。2025 年全国白酒产量 354.8 万千升，同比 -12.1%；行业规模回落到 6500 亿左右，降幅超两成；渠道平均存货周转天数约 900 天，两年多才能出清。这是真的冷。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#6b6b6b;background:#faf3e8;border-left:4px solid #b8862f;padding:16px 18px;margin:0 0 24px;letter-spacing:0.3px;line-height:1.85;\">把一轮周期性调整，误读成永久性消亡，是这一轮市场最大的认知差。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">冷的是量和库存，不是人心里的那杯酒。</p>\n\n<p style=\"text-align:center;font-size:18px;font-weight:bold;color:#1a1a1a;margin:52px 0 24px;line-height:1.5;\"><span style=\"display:inline-block;width:5px;height:18px;background:#8b2e2e;vertical-align:-2px;margin-right:11px;\"></span><span style=\"color:#b8862f;font-size:14px;font-weight:bold;letter-spacing:1px;\">04&nbsp;&nbsp;</span>我只算三笔账<span style=\"display:inline-block;width:5px;height:18px;background:#8b2e2e;vertical-align:-2px;margin-left:11px;\"></span></p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;letter-spacing:0.3px;\">股价是情绪给的，价值是生意给的。我只信后者。</p>\n\n<p style=\"font-size:13px;color:#8a8378;text-align:center;margin:0 0 10px;letter-spacing:0.5px;\">泸州老窖 · 估值快照（2026 年 10 月）</p>\n\n<table style=\"width:100%;border-collapse:collapse;margin:0 0 26px;font-size:14px;\">\n  <tr>\n    <td style=\"padding:11px 12px;color:#6b6b6b;border-bottom:1px solid #ece3d2;background:#faf6ef;\">股价</td>\n    <td style=\"padding:11px 12px;color:#1a1a1a;font-weight:bold;text-align:right;border-bottom:1px solid #ece3d2;background:#faf6ef;\">约 70 元</td>\n  </tr>\n  <tr>\n    <td style=\"padding:11px 12px;color:#6b6b6b;border-bottom:1px solid #ece3d2;\">总市值</td>\n    <td style=\"padding:11px 12px;color:#1a1a1a;font-weight:bold;text-align:right;border-bottom:1px solid #ece3d2;\">约 1030 亿</td>\n  </tr>\n  <tr>\n    <td style=\"padding:11px 12px;color:#6b6b6b;border-bottom:1px solid #ece3d2;background:#faf6ef;\">2024 归母净利润</td>\n    <td style=\"padding:11px 12px;color:#1a1a1a;font-weight:bold;text-align:right;border-bottom:1px solid #ece3d2;background:#faf6ef;\">134.7 亿</td>\n  </tr>\n  <tr>\n    <td style=\"padding:11px 12px;color:#6b6b6b;border-bottom:1px solid #ece3d2;\">2025 归母净利润</td>\n    <td style=\"padding:11px 12px;color:#1a1a1a;font-weight:bold;text-align:right;border-bottom:1px solid #ece3d2;\">108.3 亿</td>\n  </tr>\n  <tr>\n    <td style=\"padding:11px 12px;color:#6b6b6b;border-bottom:1px solid #ece3d2;background:#faf6ef;\">市净率 PB</td>\n    <td style=\"padding:11px 12px;color:#1a1a1a;font-weight:bold;text-align:right;border-bottom:1px solid #ece3d2;background:#faf6ef;\">约 2.4 倍</td>\n  </tr>\n  <tr>\n    <td style=\"padding:11px 12px;color:#6b6b6b;border-bottom:1px solid #ece3d2;\">2025 年度分红</td>\n    <td style=\"padding:11px 12px;color:#1a1a1a;font-weight:bold;text-align:right;border-bottom:1px solid #ece3d2;\">65 亿（10 派 44.17）</td>\n  </tr>\n  <tr>\n    <td style=\"padding:11px 12px;color:#8b2e2e;font-weight:bold;background:#faf6ef;\">股息率</td>\n    <td style=\"padding:11px 12px;color:#8b2e2e;font-weight:bold;text-align:right;background:#faf6ef;\">6% 以上</td>\n  </tr>\n</table>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 16px;letter-spacing:0.3px;\"><strong style=\"color:#8b2e2e;\">第一笔，分红账。</strong>2025 年度分红 65 亿，按 1030 亿市值算，股息率 6.3%，这还没算中期分红。行业再冷，账上的现金和分红能力还在。这笔钱是现金，不是故事。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 16px;letter-spacing:0.3px;\"><strong style=\"color:#8b2e2e;\">第二笔，利润账。</strong>2.4 倍 PB 买的是什么？是每年 25% 到 30% 的 ROE。等于用 2.4 倍的价格，买一台年化赚三成的机器。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">我再保守地算一遍：就算把它的盈利能力打到只剩 8 到 10 个点，2.4 倍 PB 对应的盈利回报也还有 4 到 5 个点。这是安全垫的下沿，不是天花板。这里说的“杠杆”，是生意本身的 ROE 被 PB 放大了一次，不是让你去融资加杠杆，这点必须说清楚。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 16px;letter-spacing:0.3px;\"><strong style=\"color:#8b2e2e;\">第三笔，修复账。</strong>现在的利润是周期底部，2026 上半年净利同比 -43%，被压得很狠。等行业出清，利润回到 120 到 130 亿的常态，估值再回到合理位置，向上的弹性很大。但我不把它算进回报，只当白送的期权。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 22px;letter-spacing:0.3px;\">三笔账合起来：分红 6% 以上，加上长期温和的利润增长我保守按 4 到 5% 算，年化 11% 往上。说白了就三句——用便宜的价格，买好东西，靠分红和内生增长慢慢赚钱，不赌估值回归。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#6b6b6b;background:#faf3e8;border-left:4px solid #b8862f;padding:16px 18px;margin:0 0 24px;letter-spacing:0.3px;line-height:1.85;\">我从不指望它涨回高估值。我只算一件事：就算它一直这么便宜，我每年能不能稳稳拿到 11%。</p>\n\n<p style=\"text-align:center;font-size:18px;font-weight:bold;color:#1a1a1a;margin:52px 0 24px;line-height:1.5;\"><span style=\"display:inline-block;width:5px;height:18px;background:#8b2e2e;vertical-align:-2px;margin-right:11px;\"></span><span style=\"color:#b8862f;font-size:14px;font-weight:bold;letter-spacing:1px;\">05&nbsp;&nbsp;</span>前提与风险<span style=\"display:inline-block;width:5px;height:18px;background:#8b2e2e;vertical-align:-2px;margin-left:11px;\"></span></p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">任何判断都有前提。不把前提讲清楚的观点，都是耍流氓。我的话要成立，得先满足四条：</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#2b2b2b;margin:0 0 10px;letter-spacing:0.3px;\">① 这是周期调整，不是需求永久消失；</p>\n<p style=\"font-size:15px;line-height:1.9;color:#2b2b2b;margin:0 0 10px;letter-spacing:0.3px;\">② 国窖 1573 的价格体系和品牌力不被颠覆；</p>\n<p style=\"font-size:15px;line-height:1.9;color:#2b2b2b;margin:0 0 10px;letter-spacing:0.3px;\">③ 分红政策延续，现金流撑得住、公司愿意分；</p>\n<p style=\"font-size:15px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">④ 没有更长期、更严厉的限制性政策。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">上面任何一条被证伪，我这篇的判断就得重做。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 16px;letter-spacing:0.3px;\">风险我也直说：去库存还没结束，短期未必见底；我买在 68，不代表 68 就是底，我不知道底在哪，也不会假装知道；分红也可能缩水，6% 是我按 2025 年水平的假设，不是承诺。</p>\n\n<p style=\"font-size:17px;line-height:1.85;color:#8b2e2e;font-weight:bold;margin:0 0 22px;letter-spacing:0.3px;\">所以别抄我的作业。你要抄的，是我算账的方法，不是我的价格。</p>\n\n<p style=\"text-align:center;font-size:18px;font-weight:bold;color:#1a1a1a;margin:52px 0 24px;line-height:1.5;\"><span style=\"display:inline-block;width:5px;height:18px;background:#8b2e2e;vertical-align:-2px;margin-right:11px;\"></span><span style=\"color:#b8862f;font-size:14px;font-weight:bold;letter-spacing:1px;\">06&nbsp;&nbsp;</span>价值底部，不要恐惧<span style=\"display:inline-block;width:5px;height:18px;background:#8b2e2e;vertical-align:-2px;margin-left:11px;\"></span></p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">市场恐慌的时候，价格由情绪定；愿意算账的人，价格由价值定。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">我的做法很笨：分批买，不一次梭哈；越跌越买，但只用闲钱，仓位有上限，绝不动生活费和借钱的钱。长钱，才配得上这种周期底部。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">把时间拉长到十年、二十年，今天这点波动，连个水花都算不上。按现在的分红水平，就算股价十年不涨，光分红也能拿回六成本金，剩下的股权，相当于慢慢白送。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 24px;letter-spacing:0.3px;\">好东西一定有价值。价格可以暂时离开价值，但不能长期无视价值。</p>\n\n<p style=\"font-size:21px;line-height:1.7;color:#8b2e2e;font-weight:900;text-align:center;margin:8px 0 26px;letter-spacing:0.5px;\">底部不是用来“抄”的，<br/>是用来“拿”的。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">恐惧的时候，把账算细一点，手就不抖了。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 20px;letter-spacing:0.3px;\">我不荐股，也不劝谁上车。我只是把我怎么想、怎么算、为什么在 68 元还伸手，原原本本摊开给你看。</p>\n\n<p style=\"font-size:16px;line-height:1.9;color:#2b2b2b;margin:0 0 30px;letter-spacing:0.3px;\">你的钱，你负责。我的钱，我负责。</p>\n\n<p style=\"font-size:12px;line-height:1.8;color:#9a9082;margin:0 0 10px;letter-spacing:0.2px;\">声明：本文为个人投资思考记录，作者持有泸州老窖股票，观点可能受持仓影响，不构成任何投资建议。文中数据来自公司年报及公开报道，可能存在滞后或误差。股市有风险，投资需谨慎。</p>\n"
}
</script>

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
